name: Deploy Core 241 to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify Phase 17 Core data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('public/data')
          manifest = json.loads((base/'manifest.json').read_text(encoding='utf-8'))
          registry = json.loads((base/'registry.json').read_text(encoding='utf-8'))
          rows = []
          for name in manifest['chunks']:
              rows.extend(json.loads((base/name).read_text(encoding='utf-8')))
          assert manifest['appId'] == 'rikkyo-uk-vocab'
          assert manifest['dataVersion'] == '0.22.1-core'
          assert manifest['generatedFromPhase'] == 17
          assert len(registry) == 623
          assert len(set(registry)) == 623
          assert len(rows) == 241
          ids = [r[0] for r in rows]
          assert len(set(ids)) == 241
          assert all(i in set(registry) for i in ids)
          assert all(r[1] and r[2] for r in rows)
          print('Core Runtime Gate: 241/241 PASS')
          print('Stable Registry: 623/623 PASS')
          PY

      - name: Verify v3 release and Common Engine pin
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          base=Path('public/data')
          manifest=json.loads((base/'manifest.json').read_text(encoding='utf-8'))
          release=json.loads(Path('public/release-manifest.json').read_text())
          lock=json.loads(Path('common-engine.lock.json').read_text())
          assert release['productVersion']=='3.3.1'
          assert release['persistenceSchemaVersion']==3
          assert release['exportFormatVersion']==3
          assert release['indexedDbVersion']==3
          assert release['datasetVersion']=='0.22.1-core'
          assert release['enrichmentVersion']=='2026-09-17-fy24-fy26-ab'
          assert manifest['enrichmentVersion']==release['enrichmentVersion']
          enrichment=json.loads((base/manifest['enrichment']).read_text(encoding='utf-8'))
          assert enrichment['entityCount']==241
          assert enrichment['sourceMatchedEntityCount']==235
          assert lock['sourceCommit']=='3e6fcb1701e721ccaf070df915446004f7f312ef'
          assert lock['hotlink'] is False
          print('v3 release tuple and Common Engine pin: PASS')
          PY
          node --check public/sw.js

      - run: pnpm run check

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser QA twice
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/rikkyo-uk-vocab/ >/dev/null; then break; fi
            sleep 1
          done
          QA_PASS=CI-CLEAN-1 pnpm run qa:browser
          QA_PASS=CI-CLEAN-2 pnpm run qa:browser

      - uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: dist

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Core 241
        id: deployment
        uses: actions/deploy-pages@v4

  production-smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Wait for the v3.3.1 release on Pages
        run: |
          for i in {1..30}; do
            version=$(curl -fsS "https://fyam8.github.io/rikkyo-uk-vocab/release-manifest.json?sha=${GITHUB_SHA}&attempt=${i}" | python -c 'import json,sys; print(json.load(sys.stdin).get("productVersion", ""))' || true)
            if [ "$version" = "3.3.1" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "GitHub Pages did not publish v3.3.1 in time" >&2
          exit 1

      - name: Install production browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Production browser QA twice
        env:
          QA_BASE_URL: https://fyam8.github.io/rikkyo-uk-vocab/?release=${{ github.sha }}
        run: |
          QA_PASS=PRODUCTION-CLEAN-1 pnpm run qa:browser
          QA_PASS=PRODUCTION-CLEAN-2 pnpm run qa:browser
