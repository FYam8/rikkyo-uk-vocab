name: Deploy paper-based Vocabulary Coach to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify uncapped paper vocabulary and frequency evidence
        run: node tools/verify-coverage.mjs

      - name: Verify v3 release and Common Engine pin
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          base=Path('public/data')
          manifest=json.loads((base/'manifest.json').read_text(encoding='utf-8'))
          release=json.loads(Path('public/release-manifest.json').read_text())
          lock=json.loads(Path('common-engine.lock.json').read_text())
          assert release['productVersion']=='4.1.1'
          assert release['persistenceSchemaVersion']==3
          assert release['exportFormatVersion']==4
          assert release['indexedDbVersion']==3
          assert release['datasetVersion']=='0.25.0-coverage'
          assert release['enrichmentVersion']=='2026-10-17-paper-coverage-v5'
          assert manifest['enrichmentVersion']==release['enrichmentVersion']
          enrichment=json.loads((base/manifest['enrichment']).read_text(encoding='utf-8'))
          assert enrichment['entityCount']==manifest['coreEntityCount']
          assert enrichment['sourceMatchedEntityCount']==sum(x['observedFrequency']>0 for x in enrichment['entities'].values())
          assert all('The passage uses' not in (x.get('generatedExample') or {}).get('sentence', '') for x in enrichment['entities'].values())
          assert all('important context' not in (x.get('cloze') or {}).get('sentence', '') for x in enrichment['entities'].values())
          method=next(x for x in enrichment['entities'].values() if x['lemma']=='method')
          assert method['cloze']['sentence']=='The electricity experiment will take place next week, so please review your class notes and _____.'
          assert method['cloze']['provenance']=='past-paper-derived'
          assert sum(x.get('selectionOrigin') == 'rikkyo-transfer' for x in enrichment['entities'].values()) >= 105
          assert lock['sourceCommit']=='6f4788386a1935d6e2703c694257c1f327b0f831'
          ui_contract=Path(lock['vendoredUiContract'])
          assert hashlib.sha256(ui_contract.read_bytes()).hexdigest()==lock['vendoredUiContractSha256']
          assert lock['uiContractArtifactSha256']==lock['vendoredUiContractSha256']
          assert lock['hotlink'] is False
          assert hashlib.sha256(Path(lock['uiRuntimeArtifact']).read_bytes()).hexdigest()==lock['uiRuntimeSha256']
          print('v3 release tuple and Common Engine pin: PASS')
          PY
          curl -fsSL "https://raw.githubusercontent.com/FYam8/english-vocab/6f4788386a1935d6e2703c694257c1f327b0f831/src/common-engine/session-orchestration.js" | sha256sum -c <(echo "e0510dcae081e852f9002bc5d7f8f1af3aa1af2c57e0254030eacb61d62974b6  -")
          curl -fsSL "https://raw.githubusercontent.com/FYam8/english-vocab/6f4788386a1935d6e2703c694257c1f327b0f831/src/common-engine/learning-ui-contract.json" | sha256sum -c <(echo "927607e2fd7e8db303083f0eb347701c1d23447267ab21af28b021ef8d999c8b  -")
          node --check public/sw.js
          curl -fsSL "https://raw.githubusercontent.com/FYam8/english-vocab/6f4788386a1935d6e2703c694257c1f327b0f831/src/common-engine/learning-ui-runtime.js" | sha256sum -c <(echo "3ecd8f6f4ccd4ad5bdc5508301ce4e0d155ef5655cde7e464ac3fb3c5c985ef4  -")

      - run: pnpm run check
      - run: node tools/verify-shared-progress.mjs --upstream
      - run: node tools/test-progress-projection.mjs

      - name: Verify actual Waseda source parity
        run: node qa/verify-coach-source.mjs

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser QA twice
        run: |
          node qa/serve-built-site.mjs &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/rikkyo-uk-vocab/ >/dev/null; then break; fi
            sleep 1
          done
          QA_PASS=CI-CLEAN-1 QA_WIDTH=390 pnpm run qa:browser
          QA_PASS=CI-CLEAN-1 QA_WIDTH=1280 pnpm run qa:browser
          QA_PASS=CI-CLEAN-2 QA_WIDTH=390 pnpm run qa:browser
          QA_PASS=CI-CLEAN-2 QA_WIDTH=1280 pnpm run qa:browser

      - uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: dist

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy verified vocabulary
        id: deployment
        uses: actions/deploy-pages@v4

  production-smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Wait for the verified curriculum on Pages
        run: |
          for i in {1..30}; do
            version=$(curl -fsS "https://fyam8.github.io/rikkyo-uk-vocab/release-manifest.json?sha=${GITHUB_SHA}&attempt=${i}" | python -c 'import json,sys; print(json.load(sys.stdin).get("productVersion", ""))' || true)
            if [ "$version" = "4.1.1" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "GitHub Pages did not publish v4.1.1 in time" >&2
          exit 1

      - name: Install production browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Production browser QA twice
        env:
          QA_BASE_URL: https://fyam8.github.io/rikkyo-uk-vocab/?release=${{ github.sha }}
        run: |
          QA_PASS=PRODUCTION-CLEAN-1 QA_WIDTH=390 pnpm run qa:browser
          QA_PASS=PRODUCTION-CLEAN-1 QA_WIDTH=1280 pnpm run qa:browser
          QA_PASS=PRODUCTION-CLEAN-2 QA_WIDTH=390 pnpm run qa:browser
          QA_PASS=PRODUCTION-CLEAN-2 QA_WIDTH=1280 pnpm run qa:browser
