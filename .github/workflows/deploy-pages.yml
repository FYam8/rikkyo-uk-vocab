name: Deploy Core 241 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Core 241 release
        run: |
          rm -rf site
          mkdir -p site
          unzip -q releases/rikkyo-uk-vocab-dist-core241-ready.zip -d site

      - name: Verify release data gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('site/data/runtime-bundle.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['dataVersion'] == '0.22.1-core'
          assert len(data['registryStableIds']) == 623
          assert len(data['entities']) == 241
          assert len(data['studyPresentations']) == 241
          assert len(data['questionDrafts']) == 476
          text = p.read_text(encoding='utf-8')
          for forbidden in ('sourceExcerptVerifiedTranscription', 'primaryLearnerExample', 'rawEvidence', 'sourcePdf'):
              assert forbidden not in text, forbidden
          print('Core Runtime Gate: 241/241 PASS')
          print('Stable Registry: 623/623 PASS')
          print('Question drafts: 476 PASS')
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Core 241
        id: deployment
        uses: actions/deploy-pages@v4
